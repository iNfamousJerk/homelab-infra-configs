# Homelab monitoring / infrastructure stack
#
# ---------------------------------------------------------------------------
# WHY EVERY SERVICE CARRIES `apparmor:unconfined`
# ---------------------------------------------------------------------------
# This stack runs inside an unprivileged LXC container. Docker in that
# environment cannot load its own "docker-default" AppArmor profile, so any
# container that does NOT explicitly opt out fails to start with:
#
#   docker: Error response from daemon: AppArmor enabled on system but the
#   docker-default profile could not be loaded: ... apparmor_parser: Unable to
#   replace "docker-default". apparmor_parser: Access denied. You need policy
#   admin privileges to manage profiles. error: exit status 243
#
# Verified on the production host: removing these entries breaks every service.
# They are a hard requirement of the LXC environment, not a stylistic choice.
# The fix would be host-side (allow the container to manage AppArmor profiles);
# until then, keep them.
#
# All image tags are pinned to the versions verified in production (never
# :latest). One rolling-`latest` image (pihole-exporter) has no matching
# release tag upstream, so it is pinned by digest instead.
# ---------------------------------------------------------------------------

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
      - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/homelab_alerts.yml:/etc/prometheus/homelab_alerts.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  cadvisor:
    # Runs WITHOUT privileged: on this host the documented host-mount approach is
    # sufficient and yields an identical set of container metric series to the
    # previous privileged container (verified: equal container_cpu_usage_seconds_total
    # series count). `apparmor:unconfined` is mandatory here — without it the
    # container cannot start at all.
    # NOTE: the `/dev/kmsg` device is intentionally absent. It does not exist in
    # the LXC userland and Docker can only attach it when the container is
    # privileged; leaving it in would break startup.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - 8080:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    ports:
      - 9115:9115
    command:
      - '--config.file=/config/blackbox.yml'
    volumes:
      - /opt/monitoring/blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - /opt/monitoring/provisioning/:/etc/grafana/provisioning/:ro
      - /opt/monitoring/dashboards/:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  pihole-exporter:
    # Pinned by digest: upstream's rolling `latest` is newer than its newest
    # release tag (v1.2.0), so no version tag matches this build.
    image: ekofr/pihole-exporter@sha256:a890cc731a39da719ba19cfd717427d93366cd36307f069d495f37a1373ccffc
    container_name: pihole-exporter
    ports:
      - 9617:9617
    environment:
      - PIHOLE_HOSTNAME=${PIHOLE_HOSTNAME:-10.0.0.2}
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD}
      - PIHOLE_PROTOCOL=http
      - PIHOLE_PORT=80
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  nut-exporter:
    image: python:3.14-alpine
    container_name: nut-exporter
    ports:
      - 9999:9999
    environment:
      - NUT_HOST=${NUT_HOST:-monitoring.internal.lan}
      - NUT_PORT=3493
      - NUT_USER=monitor
      - NUT_PASSWORD=${NUT_PASSWORD}
    volumes:
      - /opt/monitoring/nut_exporter.py:/app/exporter.py:ro
    command: python /app/exporter.py
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    ports:
      - 9093:9093
    volumes:
      - /opt/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  webhook:
    image: python:3.14-alpine
    container_name: webhook
    ports:
      - 5000:5000
    volumes:
      - /opt/monitoring/webhook/receiver.py:/app/receiver.py:ro
    command: python -u /app/receiver.py
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: uptime-kuma
    security_opt:
      - apparmor:unconfined
    ports:
      - 3001:3001
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      # Matches the healthcheck shipped in the upstream image.
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g

  gitea:
    image: gitea/gitea:1.27.3
    container_name: gitea
    security_opt:
      - apparmor:unconfined
    ports:
      - 3002:3000
      - 2222:22
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-gitea.example.lan}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-http://gitea.example.lan}
      - GITEA__server__SSH_PORT=2222
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g

  portainer-agent:
    image: portainer/agent:2.45.1
    container_name: portainer_agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    # Required for the same reason as every other service above.
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  gitea_data:
  uptime_kuma_data:
  prometheus_data:
  grafana_data:
  vaultwarden_data:
