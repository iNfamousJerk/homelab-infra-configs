# ============================================================
# Pirate Media Stack — Production Mode (ProtonVPN via Gluetun)
# ============================================================
# Only qBittorrent routes through Gluetun VPN.
# All other services are direct (needed for LAN access).
#
# Before first run:
#   1. Create .env file in this directory with:
#      VPN_USER=your_protonvpn_username
#      VPN_PASSWORD=your_protonvpn_password
#      VAULTWARDEN_ADMIN_TOKEN=your_secure_token
#   2. Enable TUN device in LXC config (see below)
#
# Nginx Proxy Manager on port 80/443 provides subdomain access:
#   *.pirate.lan → LXC_IP
# NPM Admin UI: http://LXC_IP:81
# Vaultwarden accessed via NPM -> vaultwarden.pirate.lan
#
# Add a wildcard A record in Pi-hole: *.pirate.lan → LXC_IP
# ============================================================
# TUN device for LXC (add to /etc/pve/lxc/CTID.conf on PVE host):
#   lxc.cgroup2.devices.allow: c 10:200 rwm
#   lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
# ============================================================

x-puid: &puid "1000"
x-pgid: &pgid "1000"
x-tz: &tz "America/New_York"
x-dns: &dns
  - "1.1.1.1"
  - "1.0.0.1"
x-restart: &restart "unless-stopped"
x-apparmor: &apparmor
  security_opt:
    - apparmor=unconfined

services:
  # ─── VPN Gateway (ProtonVPN via OpenVPN) ────────────────────
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Required: VPN credentials (set in .env file)
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      # Server selection (optional — omit for auto)
      # - SERVER_REGIONS=US  # e.g. US, NL, Iceland, Switzerland
      # - SERVER_CITIES=US-CA#TOR
      # WireGuard alternative (comment OpenVPN above, uncomment below):
      # - VPN_TYPE=wireguard
      # - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY}
      # - WIREGUARD_ADDRESSES=${WG_ADDRESSES}
      # Port forwarding (ProtonVPN — only on P2P servers)
      # - VPN_PORT_FORWARDING=on
      # - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # 🔒 Kill Switch (enabled by default — explicit for visibility)
      # Gluetun's iptables firewall blocks ALL non-VPN traffic.
      # If the VPN drops, the tunnel interface disappears and
      # qBittorrent (sharing Gluetun's network namespace) cannot
      # send or receive anything. No traffic leak possible.
      - FIREWALL=on
      # - FIREWALL_DEBUG=on  # uncomment to log firewall rules
      # DNS
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      - TZ=*tz
      # Health check
      - HEALTH_VPN_DURATION_INITIAL=30s
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      # qBittorrent Web UI (routed through VPN)
      - "8080:8080"
      # qBittorrent P2P ports
      - "6881:6881"
      - "6881:6881/udp"
    restart: *restart

  # ─── Reverse Proxy (Web UI) ────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./config/npm/data:/data
      - ./config/npm/letsencrypt:/etc/letsencrypt
    restart: *restart

  # ─── Password Manager ──────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - SIGNUPS_ALLOWED=true
      - DOMAIN=https://vaultwarden.pirate.lan
      - WEBSOCKET_ENABLED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-CHANGEME_ADMIN_TOKEN}
    volumes:
      - ./config/vaultwarden:/data
    restart: *restart

  # ─── Torrent Client (VPN-protected) ─────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
      UMASK: "002"
      WEBUI_PASSWORD: adminadmin
    volumes:
      - ./config/qbittorrent:/config
      - /data:/data
    <<: *apparmor
    restart: *restart

  # ─── Indexer Aggregator ────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    <<: *apparmor
    restart: *restart

  # ─── Cloudflare Bypass ─────────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=warn
    ports:
      - "8191:8191"
    restart: *restart

  # ─── Movie Automation ──────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/radarr:/config
      - /data:/data
    ports:
      - "7878:7878"
    <<: *apparmor
    restart: *restart

  # ─── TV Show Automation ────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/sonarr:/config
      - /data:/data
    ports:
      - "8989:8989"
    <<: *apparmor
    restart: *restart

  # ─── Music Automation ──────────────────────────────────────
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/lidarr:/config
      - /data:/data
    ports:
      - "8686:8686"
    <<: *apparmor
    restart: *restart

  # ─── Subtitles ─────────────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/bazarr:/config
      - /data:/data
    ports:
      - "6767:6767"
    <<: *apparmor
    restart: *restart

  # ─── Media Server ──────────────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/jellyfin:/config
      - /data/media:/data/media
      - /data/torrents:/data/torrents
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "104"
    ports:
      - "8096:8096"
    <<: *apparmor
    restart: *restart

  # ─── Media Requests ────────────────────────────────────────
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: *tz
      PORT: 5055
    volumes:
      - ./config/seerr:/config
    ports:
      - "5055:5055"
    <<: *apparmor
    restart: *restart


  # ─── Media Requests ────────────────────────────────────────
  requestrr:
    image: darkalfx/requestrr:latest
    container_name: requestrr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: America/Los_Angeles
    volumes:
      - ./config/requestrr:/root/config
    ports:
      - 4545:4545
    <<: *apparmor
    restart: *restart
  # ─── Book Automation ───────────────────────────────────────
  readarr:
    image: linuxserver/readarr:amd64-develop-version-0.4.18.2805
    container_name: readarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/readarr:/config
      - /data:/data
    ports:
      - 8787:8787
    <<: *apparmor
    restart: *restart

  # ─── Audiobook & eBook Server ──────────────────────────────
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: *tz
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - /data/media/books:/audiobooks
      - /data/media/books:/ebooks
      - /data/torrents/books:/torrents
    ports:
      - 13378:80
    <<: *apparmor
    restart: *restart
