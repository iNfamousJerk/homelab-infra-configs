global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/homelab_alerts.yml

# ──────────────────────────────────────────────────────────────────────
# Targets live in /etc/prometheus/targets/*.yml, not inline here.
#
# Every target in this file used to be the literal placeholder "10.2.7.x"
# — including eight identical entries under node_containers — so the
# committed copy could not actually be deployed, which defeats the point
# of keeping it in git as a rebuild reference.
#
# Real addresses now sit in targets/*.yml, which is gitignored. Each has a
# tracked *.yml.example alongside it recording which CT is which, so the
# structure stays reviewable while the addresses stay out of the repo.
#
# Rebuild:  cd targets && for f in *.yml.example; do cp "$f" "${f%.example}"; done
#           then fill in the addresses.
#
# Prometheus re-reads these files on change — no restart needed to add a
# target, unlike the previous inline form.
# ──────────────────────────────────────────────────────────────────────

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Node Exporters (System Metrics) ─────────────────────
  # Job names are load-bearing: homelab_alerts.yml matches job=~"node_.*".
  - job_name: 'node_pve'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node_pve.yml

  - job_name: 'node_containers'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node_containers.yml

  # ─── Docker Metrics ──────────────────────────────────────
  - job_name: 'cadvisor'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor.yml

  # ─── Service & Infrastructure Probes ────────────────────
  - job_name: 'pihole'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pihole.yml

  - job_name: 'nut'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nut.yml

  # HTTP probes — web UIs that accept plain HTTP
  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox_http.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP probes — services behind SSL or non-HTTP protocols
  - job_name: 'blackbox_tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          # CT 100 — Hermes Agent
          - 10.2.7.x:22
          - 10.2.7.x:8642
          # CT 110 — NPM
          - 10.2.7.x:80
          # PVE1 / PBS
          - 10.2.7.x:8006
          - 10.2.7.x:22
          # PVE2 / PBS
          - 10.2.7.x:8006
          - 10.2.7.x:22
          - 10.2.7.x:8007
          # CT 111 — Immich SSH
          - 10.2.7.x:22
          # CT 112 — Nextcloud SSH
          - 10.2.7.x:22
          # CT 110 — Media stack SSH
          - 10.2.7.x:22
          # Pi-hole DNS
          - 10.2.7.x:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
