global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/homelab_alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Node Exporters (System Metrics) ─────────────────────
  - job_name: 'node_pve'
    static_configs:
      - targets:
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'

  - job_name: 'node_containers'
    static_configs:
      - targets:
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'
          - '10.2.7.x:9100'

  # ─── Docker Metrics ──────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['10.2.7.x:8080']

  # ─── Service & Infrastructure Probes ────────────────────
  - job_name: 'pihole'
    static_configs:
      - targets: ['10.2.7.x:9617']

  - job_name: 'nut'
    static_configs:
      - targets: ['10.2.7.x:9999']

  # HTTP probes — web UIs that accept plain HTTP
  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # CT 111 — Immich
          - http://10.2.7.x:2283
          # CT 102 — PiAlert
          - http://10.2.7.x
          # CT 107 — Pi-hole
          - http://10.2.7.x
          # CT 106 — Grafana
          - http://10.2.7.x:3000
          # CT 110 — Media Stack on PVE2
          - http://10.2.7.x:8096
          - http://10.2.7.x:7878
          - http://10.2.7.x:8989
          - http://10.2.7.x:8686
          - http://10.2.7.x:9696
          - http://10.2.7.x:6767
          - http://10.2.7.x:5055
          - http://10.2.7.x:8080
          - http://10.2.7.x:81
          - http://10.2.7.x:8787
          - http://10.2.7.x:13378
          # PVE2 web UI is TCP-probed below (self-signed TLS fails HTTP probe)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP probes — services behind SSL or non-HTTP protocols
  - job_name: 'blackbox_tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          # CT 100 — Hermes Agent
          - 10.2.7.x:22
          - 10.2.7.x:8642
          # CT 110 — NPM
          - 10.2.7.x:80
          # CT 105 — Wazuh
          - 10.2.7.x:443
          - 10.2.7.x:55000
          - 10.2.7.x:9200
          # PVE1 / PBS
          - 10.2.7.x:8006
          - 10.2.7.x:22
          # PVE2 / PBS
          - 10.2.7.x:8006
          - 10.2.7.x:22
          - 10.2.7.x:8007
          # CT 111 — Immich SSH
          - 10.2.7.x:22
          # CT 112 — Nextcloud SSH
          - 10.2.7.x:22
          # CT 110 — Media stack SSH
          - 10.2.7.x:22
          # Pi-hole DNS
          - 10.2.7.x:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
